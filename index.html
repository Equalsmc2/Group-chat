<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#030408">
    <title>DND Comm // Boston Metro 2026</title>

    <!-- Leaflet Dark Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="css.css">
</head>
<body>
    <div class="metaverse-canvas"></div>
    <div class="speed-lines" id="speedLines"></div>

    <!-- Master Desktop Split Layout -->
    <div class="app-layout">
        
        <!-- LEFT: CHAT CONTAINER -->
        <div class="left-pane">
            <div class="chat-container" id="chatContainer">
                <div class="glass-rim-reflection"></div>

                <header class="chat-header">
                    <div class="group-info">
                        <div class="group-avatar" id="groupAvatar">
                            <span class="avatar-icon">⚙️</span>
                        </div>
                        <div class="group-text">
                            <div class="phantom-pill">SMS // DIRECT MESSAGING</div>
                            <h1>Soul Seekers</h1>
                            <span class="member-count"><span class="pulse-dot"></span>6 ONLINE</span>
                        </div>
                    </div>

                    <div class="user-selector">
                        <label for="currentUserSelect">CHARACTER</label>
                        <div class="select-wrapper">
                            <select id="currentUserSelect" aria-label="Select your operative">
                                <option value="Observer">Observer</option>
                                <option value="Max">Max</option>
                                <option value="Jeanette">Jeanette</option>
                                <option value="Magnus">Magnus</option>
                                <option value="Asya">Asya</option>
                                <option value="Alexandria">Alexandria</option>
                                <option value="Fitz">Fitz</option>
                            </select>
                        </div>
                    </div>
                </header>

                <main class="chat-messages" id="chatMessages" aria-live="polite"></main>

                <footer class="chat-input-area">
                    <form id="messageForm">
                        <div class="input-container-glass">
                            <span class="input-comic-tag">TEXT:</span>
                            <input type="text" id="messageInput" placeholder="Input your message..." autocomplete="off" required="">
                            <button type="submit" class="send-btn" id="sendBtn" aria-label="Send Message">
                                <span class="btn-text">SEND</span>
                                <svg class="send-icon" viewBox="0 0 24 24">
                                    <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                                </svg>
                            </button>
                        </div>
                    </form>
                </footer>
            </div>
        </div>

        <!-- RIGHT: TOP MAP + BOTTOM MUSIC -->
        <div class="right-pane">
            
            <!-- TOP RIGHT: BOSTON CITY MAP -->
            <section class="side-card map-card">
                <div class="card-comic-header">
                    <span class="card-pill">GPS // RADAR</span>
                    <h2>BOSTON CITY</h2>
                    <span id="mapTelemetry" class="telemetry-tag">SCANNING SATELLITE...</span>
                </div>
                <div class="map-viewport-wrapper">
                    <div id="bostonMap"></div>
                </div>
            </section>

            <!-- BOTTOM RIGHT: MUSIC PLAYER & SOUND VISUALIZER -->
            <section class="side-card music-card">
                <div class="card-comic-header">
                    <span class="card-pill">BGM // AUDIO STREAM</span>
                    <h2>TRACK PLAYING</h2>
                </div>

                <div class="music-content">
                    <div class="cover-art-container">
                        <img id="musicCover" src="" alt="Album Artwork" />
                        <div class="cover-overlay-glow"></div>
                    </div>

                    <div class="music-details">
                        <h3 id="musicTitle">Loading Track...</h3>
                        <p id="musicArtist">YouTube Stream</p>

                        <!-- Equalizer Waveform Canvas -->
                        <div class="visualizer-container">
                            <canvas id="visualizerCanvas"></canvas>
                        </div>

                        <!-- Controls -->
                        <div class="music-controls">
                            <button id="playPauseBtn" class="hud-btn">▶ PLAY</button>
                            <button id="nextTrackBtn" class="hud-btn">NEXT ⏭</button>
                            <div class="yt-custom-loader">
                                <input type="text" id="ytUrlInput" placeholder="Paste YouTube link / ID..." />
                                <button id="loadUrlBtn" class="hud-btn-mini">LOAD</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Hidden YouTube IFrame Container -->
                <div id="ytPlayerFrame"></div>
            </section>

        </div>
    </div>

    <div id="particleStage"></div>

    <!-- Scripts -->
    <script type="module" src="js.js"></script>
    <script type="module" src="bostonMap.js"></script>
    <script type="module" src="musicPlayer.js"></script>
</body>
</html>
