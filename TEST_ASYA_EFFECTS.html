<script>
const structures=['flip','mirror','tear','zoom','roll','tilt','stutter','skew'];const signals=['pixel','chroma','solarize','posterize','macroblock','scanline','ghost','dropout'];const s=document.querySelector('#structure'),g=document.querySelector('#signal'),label=document.querySelector('#last');for(const v of structures)s.add(new Option(v,v));for(const v of signals)g.add(new Option(v,v));
const clips=['king-crimson','tv-static','king-crimson-cut'];let lastTimer=0,seq=0;
function blocks(seed){const root=document.querySelector('.asya-glitch-macroblocks');root.replaceChildren();let n=seed>>>0;const next=()=>{n=(Math.imul(n,1664525)+1013904223)>>>0;return n/4294967296};const f=document.createDocumentFragment();for(let i=0;i<26;i++){const x=document.createElement('i');x.style.left=Math.floor(next()*94)+'%';x.style.top=Math.floor(next()*94)+'%';x.style.width=(2+Math.floor(next()*11))+'%';x.style.height=(2+Math.floor(next()*9))+'%';x.style.opacity=String(.34+next()*.6);x.style.setProperty('--tile-color',['#ff3f78','#e6eaff','#36edff','#030309'][Math.floor(next()*4)]);f.append(x)}root.append(f)}
function trigger(){clearTimeout(lastTimer);const a=s.value||structures[Math.floor(Math.random()*structures.length)],b=g.value||signals[Math.floor(Math.random()*signals.length)];document.body.classList.remove('legendary-signal-burst');void document.body.offsetWidth;document.body.dataset.asyaStructure=a;document.body.dataset.asyaSignal=b;blocks(12345+seq++*127);document.body.classList.add('legendary-signal-burst');label.textContent=a.toUpperCase()+' + '+b.toUpperCase();lastTimer=setTimeout(()=>{document.body.classList.remove('legendary-signal-burst')},500)}document.querySelector('#random').addEventListener('click',trigger);
document.querySelector('#sound').addEventListener('click',()=>{const name=clips[Math.floor(Math.random()*clips.length)];const audio=new Audio('assets/legendary/asya/asya-skip-'+name+'-short-v4010.mp3');audio.volume=.95;audio.play().catch(e=>{label.textContent='Audio blocked: '+e.name})});
const forced=new URLSearchParams(location.search).get('combo');if(forced){const [a,b]=forced.split('+');if(structures.includes(a))s.value=a;if(signals.includes(b))g.value=b;setTimeout(trigger,120)}
</script></body></html>
