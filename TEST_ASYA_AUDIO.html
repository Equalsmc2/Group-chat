<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soul Seekers V40.10 — Asya Audio Test</title><style>
body{background:#100d19;color:#f8f3ff;font:16px/1.5 system-ui;margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(90vw,650px);border:1px solid #ba638b;padding:28px;background:#23132b;border-radius:10px}button{background:#ad2251;border:1px solid #fcb2d0;color:white;padding:12px;margin:5px;cursor:pointer}button:focus-visible{outline:3px solid white}#status{margin-top:12px;padding:12px;background:#100d19}
</style></head><body><main><h1>ASYA // TIME-SKIP SOUNDS</h1><p>Only the three audio clips from Asya(3).zip are used. Each click stops the previous sound before playing a new one. The quick versions are half a second.</p><button id="randomFull">Random full</button><button id="randomQuick">Random quick</button><hr><div id="clips"></div><p id="status" role="status">Sound enabled after clicking a button.</p></main><script>
const clips=[
 ['King Crimson','king-crimson'],
 ['TV static (third supplied clip)','tv-static'],
 ['King Crimson cut','king-crimson-cut']
];
let current=null;
function play(name,short){if(current){current.pause();current.currentTime=0}current=new Audio('assets/legendary/asya/asya-skip-'+name+(short?'-short':'')+'-v4010.mp3');current.volume=.94;current.play().then(()=>{document.querySelector('#status').textContent='Playing: '+name+(short?' · 0.5 seconds':' · full')}).catch(e=>document.querySelector('#status').textContent='Playback blocked: '+e.message)}
const root=document.querySelector('#clips');clips.forEach(([label,id])=>{for(const quick of [false,true]){const b=document.createElement('button');b.textContent=label+(quick?' · quick':' · full');b.onclick=()=>play(id,quick);root.append(b)}});
document.querySelector('#randomFull').onclick=()=>play(clips[Math.floor(Math.random()*3)][1],false);
document.querySelector('#randomQuick').onclick=()=>play(clips[Math.floor(Math.random()*3)][1],true);
</script></body></html>
